# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - character-manager-advanced

on:
  push:
    branches:
      - Master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install, build, and test
        run: |
          npm ci
          npm run build:ts
          npm run build --if-present
          npm run test --if-present

      - name: Seed selected database
        shell: bash
        env:
          DATABASE_PROVIDER: ${{ vars.DATABASE_PROVIDER }}
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          MONGODB_DATABASE: ${{ vars.MONGODB_DATABASE }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AZURE_COSMOS_CONNECTIONSTRING: ${{ secrets.AZURE_COSMOS_CONNECTIONSTRING }}
          AZURE_COSMOS_LISTCONNECTIONSTRINGURL: ${{ secrets.AZURE_COSMOS_LISTCONNECTIONSTRINGURL }}
          AZURE_COSMOS_SCOPE: ${{ vars.AZURE_COSMOS_SCOPE }}
          AZURE_COSMOS_CLIENTID: ${{ secrets.AZURE_COSMOS_CLIENTID }}
          AZURE_COSMOS_CLIENTSECRET: ${{ secrets.AZURE_COSMOS_CLIENTSECRET }}
          AZURE_COSMOS_TENANTID: ${{ secrets.AZURE_COSMOS_TENANTID }}
        run: |
          if [ -z "${DATABASE_PROVIDER}${AZURE_SQL_SERVER}${MONGODB_URI}${AZURE_COSMOS_CONNECTIONSTRING}${AZURE_COSMOS_LISTCONNECTIONSTRINGURL}" ]; then
            echo "Skipping remote seed because no online database settings were configured for GitHub Actions."
            exit 0
          fi
          npm run db:seed:online

      - name: Create deploy package
        run: |
          mkdir -p deploy-package
          cp package.json deploy-package/package.json
          cp package-lock.json deploy-package/package-lock.json
          if [ -f .npmrc ]; then cp .npmrc deploy-package/.npmrc; fi
          cp -R app deploy-package/
          cp -R data deploy-package/data
          if [ -d public ]; then cp -R public deploy-package/public; fi
          mkdir -p deploy-package/app/vendor/dice-box
          cp -R node_modules/@3d-dice/dice-box/dist/* deploy-package/app/vendor/dice-box/
          test -f deploy-package/app/server.js
          test -f deploy-package/app/app.js
          test ! -d deploy-package/app/app

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy-package
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'character-manager-advanced'
          slot-name: 'Production'
          package: deploy-package
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_98F2C7ADEDE141C39758DEB5B1FFD30D }}
