name: Deploy To Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build-test-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build scripts
        run: npm run build:ts

      - name: Run tests
        run: npm test

      - name: Seed Azure SQL
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_USERNAME: ${{ secrets.AZURE_SQL_USERNAME }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
        run: npm run db:seed:azure

      - name: Create deploy package
        run: |
          mkdir -p deploy-package
          cp package.json deploy-package/package.json
          cp package-lock.json deploy-package/package-lock.json
          cp -R app deploy-package/app

      - name: Upload deploy package
        uses: actions/upload-artifact@v4
        with:
          name: app-service-package
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build-test-seed
    environment: production
    steps:
      - name: Download deploy package
        uses: actions/download-artifact@v4
        with:
          name: app-service-package
          path: deploy-package

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          app-settings-json: >-
            [
              { "name": "WEBSITE_NODE_DEFAULT_VERSION", "value": "~22", "slotSetting": false },
              { "name": "NODE_ENV", "value": "production", "slotSetting": false },
              { "name": "SCM_DO_BUILD_DURING_DEPLOYMENT", "value": "true", "slotSetting": false },
              { "name": "ENABLE_ORYX_BUILD", "value": "true", "slotSetting": false },
              { "name": "AZURE_SQL_SERVER", "value": "${{ secrets.AZURE_SQL_SERVER }}", "slotSetting": false },
              { "name": "AZURE_SQL_USERNAME", "value": "${{ secrets.AZURE_SQL_USERNAME }}", "slotSetting": false },
              { "name": "AZURE_SQL_PASSWORD", "value": "${{ secrets.AZURE_SQL_PASSWORD }}", "slotSetting": false }
            ]

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: deploy-package
